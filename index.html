<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ScanFlow - 智能扫码系统</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="topbar">
        <div class="topbar-left">
            <span class="topbar-logo">ScanFlow</span>
        </div>
        <div class="topbar-right">
            <span style="font-size:14px;color:var(--text-secondary);" id="current-date"></span>
        </div>
    </header>

    <div class="container">
        <!-- 统计卡片 -->
        <div class="stats-grid" id="stats-grid">
            <div class="stat-card">
                <div class="stat-value" id="stat-products">0</div>
                <div class="stat-label">商品总数</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="stat-stock">0</div>
                <div class="stat-label">当前库存</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="stat-tx">0</div>
                <div class="stat-label">今日交易</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="stat-revenue">0</div>
                <div class="stat-label">今日营收</div>
            </div>
        </div>

        <!-- 功能入口 -->
        <h2 style="font-size:18px;font-weight:700;margin-bottom:16px;">功能导航</h2>
        <div class="home-grid">
            <a href="inventory.html" class="home-card">
                <span class="home-card-icon">📦</span>
                <div class="home-card-title">扫码出入库</div>
                <div class="home-card-desc">扫码入库 / 出库 / 操作记录</div>
            </a>
            <a href="checkout-self.html" class="home-card">
                <span class="home-card-icon">🛒</span>
                <div class="home-card-title">自助收银</div>
                <div class="home-card-desc">用户自助扫码购物结算</div>
            </a>
            <a href="checkout-staff.html" class="home-card">
                <span class="home-card-icon">👨‍💼</span>
                <div class="home-card-title">人工收银</div>
                <div class="home-card-desc">员工专用，需密码登录</div>
            </a>
        </div>

        <!-- 今日营业报表 -->
        <h2 style="font-size:18px;font-weight:700;margin:24px 0 16px;">📈 今日营业报表</h2>
        <div class="report-grid" id="report-grid"></div>

    </div>

    <script src="js/config.js"></script>
    <script src="js/db.js"></script>
    <script src="js/common.js"></script>
    <script>
        // 显示当前日期
        function updateDate() {
            const now = new Date();
            const pad = n => String(n).padStart(2, '0');
            document.getElementById('current-date').textContent =
                `${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())}`;
        }

        // 更新统计数据
        function updateStats() {
            const stats = DB.getStats();
            document.getElementById('stat-products').textContent = stats.totalProducts;
            document.getElementById('stat-stock').textContent = stats.totalStock;
            document.getElementById('stat-tx').textContent = stats.todayTxCount;
            document.getElementById('stat-revenue').textContent = '\u00a5' + stats.todayRevenue.toFixed(2);
        }

        // 今日营业报表
        function renderReport() {
            const el = document.getElementById('report-grid');
            if (!el) return;
            const today = new Date(); today.setHours(0, 0, 0, 0);
            const txs = DB.getTransactions(2000).filter(t => t.timestamp >= today.getTime());

            const payNames = { cash: '现金', wechat: '微信', alipay: '支付宝' };
            const payMap = {};
            txs.forEach(t => {
                payMap[t.paymentMethod] = payMap[t.paymentMethod] || { count: 0, amount: 0 };
                payMap[t.paymentMethod].count++;
                payMap[t.paymentMethod].amount += t.total;
            });
            const payHtml = Object.keys(payMap).length
                ? Object.keys(payMap).map(m => `
                    <div class="report-row">
                        <span>${payNames[m] || m}</span>
                        <span>${payMap[m].count} 笔 · ${formatMoney(payMap[m].amount)}</span>
                    </div>`).join('')
                : '<div class="report-empty">今日暂无交易</div>';

            const prodMap = {};
            txs.forEach(t => t.items.forEach(i => { prodMap[i.name] = (prodMap[i.name] || 0) + i.quantity; }));
            const top = Object.entries(prodMap).sort((a, b) => b[1] - a[1]).slice(0, 5);
            const topHtml = top.length
                ? top.map(([name, q], idx) => `
                    <div class="report-row">
                        <span>${idx + 1}. ${escapeHtml(name)}</span>
                        <span>${q} 件</span>
                    </div>`).join('')
                : '<div class="report-empty">今日暂无销售</div>';

            const totalAmount = txs.reduce((s, t) => s + t.total, 0);
            el.innerHTML = `
                <div class="report-card">
                    <div class="report-card-title">💰 收款方式</div>
                    ${payHtml}
                    <div class="report-row report-total"><span>合计</span><span>${formatMoney(totalAmount)}</span></div>
                </div>
                <div class="report-card">
                    <div class="report-card-title">🔥 热销商品 Top5</div>
                    ${topHtml}
                </div>
            `;
        }

        document.addEventListener('DOMContentLoaded', () => {
            DB.init().then(() => {
                updateDate();
                updateStats();
                renderReport();
            });
            // 云端数据变化时刷新统计卡片与报表
            DB.onSync = () => { updateStats(); renderReport(); };
        });
    </script>
</body>
</html>
