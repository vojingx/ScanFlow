<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ScanFlow - 智能扫码系统</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="topbar">
        <div class="topbar-left">
            <span class="topbar-logo">ScanFlow</span>
        </div>
        <div class="topbar-right">
            <span style="font-size:14px;color:var(--text-secondary);" id="current-date"></span>
        </div>
    </header>

    <div class="container">
        <!-- 统计卡片 -->
        <div class="stats-grid" id="stats-grid">
            <div class="stat-card">
                <div class="stat-value" id="stat-products">0</div>
                <div class="stat-label">商品总数</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="stat-stock">0</div>
                <div class="stat-label">当前库存</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="stat-tx">0</div>
                <div class="stat-label">今日交易</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="stat-revenue">0</div>
                <div class="stat-label">今日营收</div>
            </div>
        </div>

        <!-- 功能入口 -->
        <h2 style="font-size:18px;font-weight:700;margin-bottom:16px;">功能导航</h2>
        <div class="home-grid">
            <a href="inventory.html" class="home-card">
                <span class="home-card-icon">📦</span>
                <div class="home-card-title">扫码出入库</div>
                <div class="home-card-desc">扫码入库 / 出库 / 操作记录</div>
            </a>
            <a href="checkout-self.html" class="home-card">
                <span class="home-card-icon">🛒</span>
                <div class="home-card-title">自助收银</div>
                <div class="home-card-desc">用户自助扫码购物结算</div>
            </a>
            <a href="checkout-staff.html" class="home-card">
                <span class="home-card-icon">👨‍💼</span>
                <div class="home-card-title">人工收银</div>
                <div class="home-card-desc">员工专用，需密码登录</div>
            </a>
        </div>

        <!-- 数据管理 -->
        <div class="data-footer">
            <div class="data-footer-title">数据管理</div>
            <div class="data-footer-buttons">
                <button class="btn btn-sm btn-outline" onclick="App.exportData()">📤 导出数据</button>
                <button class="btn btn-sm btn-outline" onclick="App.importData()">📥 导入数据</button>
                <button class="btn btn-sm btn-danger" onclick="App.resetData()">🗑️ 清空数据</button>
            </div>
            <input type="file" id="import-file" accept="application/json,.json" style="display:none;" onchange="App.handleImportFile(event)">
            <span class="data-footer-tip">数据可导出为文件自行保存，不依赖本浏览器；换设备时导入即可继续使用</span>
        </div>
    </div>

    <script src="js/db.js"></script>
    <script src="js/common.js"></script>
    <script>
        const App = {
            // 导出数据为 JSON 文件，存在用户自己手里，而不是锁在浏览器里
            exportData() {
                const json = DB.exportData();
                if (!json) {
                    showToast('当前没有可导出的数据', 'default');
                    return;
                }
                const blob = new Blob([json], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                const d = new Date();
                const pad = n => String(n).padStart(2, '0');
                a.href = url;
                a.download = `scanflow-data-${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}.json`;
                a.click();
                URL.revokeObjectURL(url);
                showToast('数据已导出为文件', 'success');
            },

            // 触发文件选择
            importData() {
                document.getElementById('import-file').click();
            },

            // 处理导入的文件
            handleImportFile(event) {
                const file = event.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = () => {
                    try {
                        const ok = DB.importData(reader.result);
                        if (ok) {
                            showToast('数据导入成功', 'success');
                            updateStats();
                        } else {
                            showToast('文件格式不正确', 'error');
                        }
                    } catch (e) {
                        showToast('导入失败：文件已损坏', 'error');
                    }
                    event.target.value = '';
                };
                reader.readAsText(file);
            },

            // 清空全部数据
            resetData() {
                if (confirm('确定要清空所有本地数据吗？\n（商品、库存、记录、交易将全部删除，且无法恢复）\n建议先「导出数据」备份。')) {
                    DB.clearAll();
                    showToast('数据已清空', 'success');
                    updateStats();
                }
            }
        };

        // 显示当前日期
        function updateDate() {
            const now = new Date();
            const pad = n => String(n).padStart(2, '0');
            document.getElementById('current-date').textContent =
                `${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())}`;
        }

        // 更新统计数据
        function updateStats() {
            const stats = DB.getStats();
            document.getElementById('stat-products').textContent = stats.totalProducts;
            document.getElementById('stat-stock').textContent = stats.totalStock;
            document.getElementById('stat-tx').textContent = stats.todayTxCount;
            document.getElementById('stat-revenue').textContent = '\u00a5' + stats.todayRevenue.toFixed(2);
        }

        document.addEventListener('DOMContentLoaded', () => {
            updateDate();
            updateStats();
        });
    </script>
</body>
</html>
