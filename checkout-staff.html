<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>人工收银 - ScanFlow</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="topbar">
        <div class="topbar-left">
            <a href="index.html" class="topbar-logo">ScanFlow</a>
            <span class="topbar-title">👨‍💼 人工收银</span>
        </div>
        <div class="topbar-right">
            <span id="staff-info" style="font-size:14px;color:var(--text-secondary);"></span>
            <a href="index.html" class="btn-back">返回首页</a>
        </div>
    </header>

    <div class="container">
        <!-- 密码验证界面 -->
        <div id="password-screen" class="password-screen">
            <div class="password-screen-icon">🔐</div>
            <div class="password-screen-title">员工登录</div>
            <div class="password-screen-desc">请输入员工密码以进入人工收银系统</div>
            <div class="input-group" style="text-align:left;">
                <input type="password" class="input-field" id="staff-password-input"
                       placeholder="请输入密码" autocomplete="off"
                       onkeydown="if(event.key==='Enter')StaffAuth.login()"
                       style="text-align:center;font-size:18px;letter-spacing:4px;">
            </div>
            <div id="password-error" style="color:var(--danger);font-size:14px;margin-bottom:16px;display:none;">
                密码错误，请重试
            </div>
            <button class="btn btn-primary btn-lg" onclick="StaffAuth.login()">登录</button>
            <div style="margin-top:20px;font-size:13px;color:var(--text-secondary);">
                默认密码：123456（可在设置中修改）
            </div>
        </div>

        <!-- 收银工作区 -->
        <div id="checkout-app" style="display:none;"></div>

        <!-- 设置弹窗 -->
        <div id="settings-modal" class="scan-modal">
            <div class="scan-modal-content" style="max-width:400px;">
                <div class="scan-modal-header">
                    <h3>⚙️ 设置</h3>
                    <button class="scan-modal-close" onclick="document.getElementById('settings-modal').classList.remove('active')">&times;</button>
                </div>
                <div class="input-group">
                    <label class="input-label">修改员工密码</label>
                    <input type="password" class="input-field" id="new-password-input" placeholder="输入新密码">
                </div>
                <div class="input-group">
                    <label class="input-label">确认新密码</label>
                    <input type="password" class="input-field" id="confirm-password-input" placeholder="再次输入新密码">
                </div>
                <button class="btn btn-primary btn-lg" onclick="StaffAuth.changePassword()">保存密码</button>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <script src="js/config.js"></script>
    <script src="js/db.js"></script>
    <script src="js/common.js"></script>
    <script src="js/scanner.js"></script>
    <script src="js/checkout.js"></script>
    <script>
        const StaffAuth = {
            logged_in: false,

            async login() {
                await DB.init();
                const input = document.getElementById('staff-password-input');
                const errorEl = document.getElementById('password-error');
                if (DB.verifyPassword(input.value)) {
                    this.logged_in = true;
                    document.getElementById('password-screen').style.display = 'none';
                    document.getElementById('checkout-app').style.display = 'block';
                    document.getElementById('staff-info').innerHTML =
                        '👤 员工 <button class="btn btn-sm btn-secondary" style="margin-left:8px;" onclick="StaffAuth.openSettings()">设置</button>';
                    Checkout.init('staff');
                    showToast('登录成功', 'success');
                } else {
                    errorEl.style.display = 'block';
                    input.value = '';
                    input.focus();
                    setTimeout(() => errorEl.style.display = 'none', 3000);
                }
            },

            openSettings() {
                document.getElementById('new-password-input').value = '';
                document.getElementById('confirm-password-input').value = '';
                document.getElementById('settings-modal').classList.add('active');
            },

            changePassword() {
                const newPwd = document.getElementById('new-password-input').value;
                const confirmPwd = document.getElementById('confirm-password-input').value;
                if (!newPwd) {
                    showToast('请输入新密码', 'error');
                    return;
                }
                if (newPwd !== confirmPwd) {
                    showToast('两次密码不一致', 'error');
                    return;
                }
                DB.setPassword(newPwd);
                document.getElementById('settings-modal').classList.remove('active');
                showToast('密码修改成功', 'success');
            },
        };

        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('staff-password-input').focus();
        });
    </script>
</body>
</html>
